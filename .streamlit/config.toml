# OFM temalari (ofm_theme.py ile ayni paletler). Streamlit'in kendi bilesenleri ve canvas ile
# cizilen tablolar bu paletleri kullanir; panel/dugme/sekme stilleri uygulama icinden secilen
# temaya gore ofm_theme.theme_css ile basilir.
[theme]
font = "sans serif"

[theme.dark]
primaryColor = "#635BFF"
backgroundColor = "#121824"
secondaryBackgroundColor = "#1e2538"
textColor = "#ffffff"

[theme.light]
primaryColor = "#10b981"
backgroundColor = "#f4f6f9"
secondaryBackgroundColor = "#ffffff"
textColor = "#1e293b"

[browser]
gatherUsageStats = false

[client]
# Tarayiciya yalnizca hata turu gider (SQL parametreleri / yigin izi sizmaz)
showErrorDetails = "type"
